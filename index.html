<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172a43">
<title>Yorushika Setlist Maker | ヨルシカ セトリメーカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img class="title-decoration title-left" src="ite_l.png" alt="">
  <div class="title-copy"><p class="eyebrow">SETLIST POSTER MAKER</p><h1>Yorushika Setlist Maker<br><span>ヨルシカ　セトリメーカー</span></h1></div>
  <img class="title-decoration title-right" src="ite_r.png" alt="">
</header>
<main>
  <section class="panel songs-panel">
    <div class="section-head"><div><p class="eyebrow">STEP 01</p><h2>曲を選ぶ</h2></div><span id="countBadge" class="count">0曲選択中</span></div>
    <label class="search-label" for="search">曲名を検索</label>
    <input id="search" type="search" placeholder="曲名を入力…" autocomplete="off">
    <div class="quick-actions"><button id="clearAll" class="btn light">選択を全解除</button></div>
    <div id="songList" class="song-list" aria-label="曲一覧"></div>
    <div class="add-row"><input id="customSong" type="text" placeholder="一覧にない曲を追加"><button id="addSong" class="btn">追加</button></div>
    <p class="hint">曲名は一覧の表記をそのまま収録。追加した曲もポスターに反映されます。</p>
  </section>

  <section class="panel editor-panel">
    <div class="section-head"><div><p class="eyebrow">STEP 02</p><h2>背景を選択</h2></div></div>
    <div class="field"><label for="posterTitle">タイトル</label><input id="posterTitle" type="text" value="SETLIST"></div>
    <div class="field"><label for="subtitle">サブタイトル（任意）</label><input id="subtitle" type="text" placeholder="例：my favorite songs"></div>
    <div class="field"><label for="posterDate">日付・メモ</label><input id="posterDate" type="text" placeholder="例：2026.10.13"></div>
    <div class="field"><label>完成画像の背景を選ぶ</label><div class="background-options" id="backgroundOptions">
      <label class="background-option selected"><input type="radio" name="posterBackground" value="ame" checked><img src="ame.png" alt="背景1"></label>
      <label class="background-option"><input type="radio" name="posterBackground" value="orange"><img src="oreng.png" alt="背景2"></label>
      <label class="background-option"><input type="radio" name="posterBackground" value="fumi"><img src="fumi.png" alt="背景3"></label>
      <label class="background-option"><input type="radio" name="posterBackground" value="umi"><img src="umi.png" alt="背景4"></label>
      <label class="background-option"><input type="radio" name="posterBackground" value="sakura"><img src="sakura.png" alt="背景5"></label>
    </div></div>
    <div class="field"><label for="fontFamily">フォント</label><select id="fontFamily"><option value="sans" selected>標準・読みやすい</option><option value="serif">明朝・細字</option><option value="rounded">丸ゴシック</option></select></div>
    <div class="field"><label for="fontWeight">文字の太さ</label><select id="fontWeight"><option value="normal">細字</option><option value="bold" selected>太字</option></select></div>
    <div class="field"><label for="textColor">文字色</label><select id="textColor"><option value="dark" selected>濃紺</option><option value="light">白</option><option value="cream">クリーム</option><option value="pink">淡いピンク</option></select></div>
    <div class="field"><label for="outlineEnabled">文字の縁取り</label><select id="outlineEnabled"><option value="on">あり</option><option value="off" selected>なし</option></select></div>
    <div class="field"><label for="outlineColor">縁取りの色</label><select id="outlineColor"><option value="navy">紺色</option><option value="white" selected>白</option><option value="black">黒</option></select></div>
    <div class="field"><label for="outlineWidth">縁取りの太さ <span id="outlineWidthValue">3px</span></label><input id="outlineWidth" type="range" min="1" max="5" step="1" value="3"></div>
    <div class="field"><label>選んだ曲の順番</label><p class="hint">↑ ↓ で順番を変更できます。</p><div id="selectedList" class="selected-list"></div></div>
    <div class="export-row"><button id="download" class="btn primary">PNG画像を保存</button><button id="refresh" class="btn light">プレビュー更新</button></div>
    <p class="hint">画像は縦長・SNS投稿向け（1080 × 1920 px）で保存されます。</p>
  </section>

  <section class="preview-section">
    <div class="preview-heading"><div><p class="eyebrow">PREVIEW</p><h2>完成イメージ</h2></div></div>
    <div class="poster-wrap"><canvas id="poster" width="540" height="960" aria-label="セトリポスターのプレビュー"></canvas></div>
  </section>
</main>
<footer>個人用のセトリ作成ツールです。入力内容はこのページ内で処理されます。<br><a href="terms.html">利用規約</a></footer>
<script src="app.js"></script>
</body>
</html>
